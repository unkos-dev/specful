# Every entry carries a justification; this file is the audit trail.
paths:
  # release.yml is generated by cargo-dist and regenerated from
  # dist-workspace.toml; hand-editing it would disable dist's own workflow
  # verification. SC2086/SC2129 are style findings in upstream's templates.
  .github/workflows/release.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2086:.*'
      - 'shellcheck reported issue in this script: SC2129:.*'
