name: Set up repository tooling
description: >-
  Install the mise-pinned tools a job needs.

  The mise-action pin lives here rather than at each call site. A workflow
  that repeats an action pin repeats the work of updating it, and the copies
  drift silently because nothing fails when one of them lags. Renovate reads
  the annotated version comment below through the same custom manager it
  uses for workflow files, so consolidating the pin does not cost visibility.

inputs:
  mise-install-args:
    description: >-
      Tools to install, passed through to mise-action's install_args. Empty
      installs everything .mise.toml pins.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install pinned tools (mise)
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
        version: "2026.8.12"
        install_args: ${{ inputs.mise-install-args }}
