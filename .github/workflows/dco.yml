name: DCO

# pull_request_target is load-bearing: the workflow definition, the checkout,
# and the checker script all come from the trusted base branch, so a pull
# request cannot weaken the gate that judges it. Head commits are fetched as
# objects only and never checked out or executed.
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -x scripts/dco-check.sh ]; then
            echo "no checker on the base branch yet; nothing to enforce"
            exit 0
          fi
          git fetch -q origin "pull/$NUMBER/head"
          scripts/dco-check.sh "$BASE" "$HEAD"
