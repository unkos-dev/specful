name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list "$BASE".."$HEAD" --no-merges); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: .*<.*@.*>'; then
              echo "::error::commit $sha lacks a Signed-off-by trailer (use git commit -s)"
              missing=1
            fi
          done
          exit "$missing"
