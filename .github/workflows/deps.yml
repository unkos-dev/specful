name: Dependencies

on:
  workflow_call:

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          mise-install-args: just github:EmbarkStudios/cargo-deny

      - name: Check dependencies (advisories, licenses, bans, sources)
        run: just deny

  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # License policy is owned by cargo-deny; this layer gates vulnerabilities only.
          fail-on-severity: moderate
