name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - name: Require a Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9][a-z0-9-]*\))?!?: .+'
          if ! grep -qE "$pattern" <<<"$TITLE"; then
            echo "::error::pull request titles become squash commit subjects and must follow Conventional Commits: <type>(<scope>): <description>"
            exit 1
          fi
