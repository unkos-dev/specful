name: Release provenance bundles

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read
  attestations: read

jobs:
  bundles:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-build-local-*
          path: artifacts
          merge-multiple: true

      - name: Export verified provenance bundles
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ inputs.plan }}
        shell: bash
        run: |
          mkdir bundles
          while IFS= read -r archive; do
            gh attestation verify "artifacts/$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --format json > verified.json
            jq -e '.[0].attestation.bundle' verified.json > "bundles/$archive.sigstore.json"
          done < <(jq -r '.artifacts | to_entries[] | select(.value.kind == "executable-zip") | .key' <<< "$PLAN")

      - name: Upload provenance bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-provenance
          path: bundles/*.sigstore.json
          if-no-files-found: error
