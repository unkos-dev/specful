# Every entry carries a justification; this file is the audit trail. An
# `ignore` suppresses a tool false-positive, never an accepted risk; a
# `disable` gives up real coverage and must state what is lost.
rules:
  # release.yml is generated by cargo-dist from dist-workspace.toml;
  # hand-editing it disables dist's own workflow verification, so upstream
  # template findings are ignored per file rather than fixed in place.
  #
  # Accepted risk, outside zizmor's audits: the generated workflow pipes
  # cargo-dist's installer script into sh without digest verification
  # (https://github.com/axodotdev/cargo-dist/issues/2420). Verifying it
  # locally would mean forking the generated template; revisit when
  # upstream ships installer verification.
  template-injection:
    # The expansions carry the pushed tag name and dist's plan output.
    # Tag pushes come only from the release-plz App on a maintainer-merged
    # release PR, so the values are not attacker-controllable here.
    ignore:
      - release.yml
  excessive-permissions:
    # Workflow-level contents:write is required to upload release assets
    # and publish the draft release; the workflow only runs on tag pushes
    # and advisory PR plans.
    ignore:
      - release.yml
  unpinned-images:
    # The container image comes from dist's build plan for musl targets and
    # is pinned by dist's own version (cargo-dist-version), not a floating
    # workflow reference.
    ignore:
      - release.yml
  ref-version-mismatch:
    # SHA pins are the control; Renovate's `# vN` comments lag upstream tag
    # moves, so this false-fails on a schedule nobody here controls.
    disable: true
  self-repository:
    # The `$/` self-repository form it asks for is rejected by actionlint
    # (latest 1.7.12 at time of writing), which runs in the same job, so the
    # in-repo `./.github/actions` references stay workspace-relative. Lost:
    # the fully pinned resolution `$/` gives external callers, which these
    # internal actions have none of. Re-enable once actionlint accepts `$/`.
    disable: true
