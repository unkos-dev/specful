# Pinned versions of every non-cargo tool the justfile recipes call. CI installs
# the same pins through mise-action, so a local `just preflight` and the
# workflow jobs run identical tool versions. A tool belongs here only if a
# recipe and a CI job both use it.
[tools]
actionlint = "1.7.12"
# Documentation site toolchain (site/): bun install and bun run build.
bun = "1.4.0"
gitleaks = "8.30.1"
jq = "1.8.2"
just = "1.58.0"
# markdownlint-compatible linter shipped as a single binary, so it needs no
# Node toolchain in a Rust-only repository.
rumdl = "0.2.63"
snyk = "1.1307.0"
typos = "1.50.1"
zizmor = "1.30.0"

# Reference validator for the Agent Skills spec, pinned to an exact commit of its
# subdirectory in the upstream monorepo; it is a demonstration tool, so Rust
# checks in tests/plugin_package.rs back it with direct frontmatter assertions.
[tools."pipx:git+https://github.com/agentskills/agentskills.git"]
version = "69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"

# Prebuilt Rust tools. The GitHub backend verifies published checksums and
# provenance where upstream ships them.
[tools."github:nextest-rs/nextest"]
version = "0.9.143"
version_prefix = "cargo-nextest-"
filter_bins = "cargo-nextest"

[tools."github:taiki-e/cargo-llvm-cov"]
version = "0.9.0"
version_prefix = "v"
filter_bins = "cargo-llvm-cov"

[tools."github:bnjbvr/cargo-machete"]
version = "0.9.2"
version_prefix = "v"
filter_bins = "cargo-machete"

[tools."github:EmbarkStudios/cargo-deny"]
version = "0.20.2"
filter_bins = "cargo-deny"
