# Markdown lint: markdownlint/rumdl defaults, with narrow deviations below.
[global]
# tests/fixtures holds repositories that are deliberately malformed.
exclude = ["target", "tests/fixtures", ".claude", "CLAUDE.md", "**/CLAUDE.md"]
# docs/adr/README.md names the `# ` heading marker; the space is significant.
disable = ["MD038"]

# List markers are dashes throughout the tree.
[MD004]
style = "dash"

# Front matter `title:` is metadata, not a second rendered H1.
[MD025]
front-matter-title = ""

# markdownlint checks tables by default; rumdl's own default does not.
[MD013]
tables = true
