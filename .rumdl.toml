# Markdown lint: markdownlint/rumdl defaults; no rule is disabled.
[global]
# tests/fixtures holds repositories that are deliberately malformed.
exclude = ["target", "tests/fixtures"]

# List markers are dashes throughout the tree.
[MD004]
style = "dash"

# Front matter `title:` is metadata, not a second rendered H1.
[MD025]
front-matter-title = ""

# 120 is the repository's chosen line-length limit; code blocks carry
# literal content and are exempt.
[MD013]
line-length = 120
headings = true
code-blocks = false
tables = true
