[package]
name = "specful"
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
description = "Repository-native software specifications for people and coding agents"
license = "Apache-2.0"
repository = "https://github.com/unkos-dev/specful"
readme = "README.md"
keywords = ["specification", "requirements", "documentation", "cli"]
categories = ["command-line-utilities", "development-tools"]
# Allowlist so repository tooling never leaks into the crate: shipping
# rust-toolchain.toml and .mise.toml overrode installers' toolchains and
# broke mise-wrapped builds in 0.1.0.
include = [
  "src/",
  "schemas/",
  "templates/",
  "/README.md",
  "/LICENSE",
  "/NOTICE.md",
]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
jsonschema = { version = "0.52.0", default-features = false }
saphyr-parser = "0.0.12"
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
