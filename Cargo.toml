[package]
name = "specful"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Repository-native software specifications for people and coding agents"
license = "Apache-2.0"
repository = "https://github.com/unkos-dev/specful"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
jsonschema = { version = "0.48.5", default-features = false }
saphyr-parser = "0.0.11"
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"
