# Install once per checkout with `lefthook install`.
pre-push:
  jobs:
    - name: specful
      run: specful validate

# {1} is the commit-message file. Merge commits certify no new work, so they are exempt.
commit-msg:
  jobs:
    - name: dco
      run: 'head -n1 {1} | grep -q "^Merge " || grep -Eq "^Signed-off-by: .+ <.+@.+>" {1}'
      fail_text: "Missing Signed-off-by trailer. Commit with git commit -s (see CONTRIBUTING.md)."
