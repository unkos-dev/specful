[workspace]
# Labels the rolling release PR so it reads the same as any other automated
# PR in the repository's label taxonomy.
pr_labels = ["release"]

# The default (true) publishes on every push to main, which would release
# 0.1.0 the moment the App secrets exist, bypassing the maintainer-merge
# approval gate CONTRIBUTING.md documents as the release act. false makes
# merging the release PR the only path to a release: upstream also
# recommends false for squash-merge repositories (this one is squash-only),
# since with true a squash merge can race an in-flight `release-plz release`
# run on main. Detection relies on the default `release-plz-` PR branch
# prefix, which this config does not override.
release_always = false

# The GitHub release stays draft so the tag-triggered dist workflow
# (release.yml) can attach binary archives before publishing it.
git_release_draft = true

[changelog]
# Keep authored release guidance under CHANGELOG.md's Unreleased heading on the base branch.
# Breaking changes retain Summary and Why so conversion instructions reach the release notes.
protect_breaking_commits = true

# Order matters: the first matching parser wins. Breaking commits are pulled
# out first so they never also land in Added/Fixed/Other, dependency commits
# (chore(deps)/fix(deps), including Renovate's lock-file-maintenance PRs,
# which carry the same scope) are pulled out next, and the remainder follows
# upstream's Keep a Changelog grouping unchanged.
commit_parsers = [
  { field = "breaking", pattern = "^true$", group = "breaking" },
  { message = "^(chore|fix)\\(deps\\)", group = "dependencies" },
  { message = "^feat", group = "added" },
  { message = "^changed", group = "changed" },
  { message = "^deprecated", group = "deprecated" },
  { message = "^removed", group = "removed" },
  { message = "^fix", group = "fixed" },
  { message = "^security", group = "security" },
  { message = ".*", group = "other" },
]

body = """

{% set breaking_commits = commits | filter(attribute="group", value="breaking") %}
{%- set dependency_commits = commits | filter(attribute="group", value="dependencies") -%}
## [{{ version }}]{%- if release_link -%}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% if breaking_commits %}
### Breaking changes

{% for commit in breaking_commits %}
{%- if commit.scope -%}
- *({{ commit.scope }})* {{ commit.breaking_description }}{% if commit.links %} ({% for link in commit.links %}[{{ link.text }}]({{ link.href }}) {% endfor -%}){% endif %}
{% else -%}
- {{ commit.breaking_description }}{% if commit.links %} ({% for link in commit.links %}[{{ link.text }}]({{ link.href }}) {% endfor -%}){% endif %}
{% endif -%}
{%- set body_kept = commit.body | split_regex(pat="(?m)^## Test plan") | first | replace_regex(from="(?m)^## Summary[ \\t]*\\n+", to="") | replace_regex(from="(?m)^## Why[ \\t]*\\n+", to="") | replace_regex(from="(?s)<!--.*?-->", to="") | trim -%}
{%- set summary_hits = commit.body | find_regex(pat="(?m)^## Summary") -%}
{%- if summary_hits | length > 0 and body_kept | length > 0 %}
{% for line in body_kept | split(pat="\\n") %}
{%- if line | trim | length > 0 %}  {{ line }}
{% else %}
{% endif -%}
{% endfor -%}
{% if not loop.last %}
{% endif -%}
{%- endif -%}
{% endfor -%}
{% endif -%}
{% for group, group_commits in commits | group_by(attribute="group") %}
{%- if group != "breaking" and group != "dependencies" %}
### {{ group | upper_first }}

{% for commit in group_commits %}
{%- if commit.scope -%}
- *({{ commit.scope }})* {{ commit.message }}{% if commit.links %} ({% for link in commit.links %}[{{ link.text }}]({{ link.href }}) {% endfor -%}){% endif %}
{% else -%}
- {{ commit.message }}
{% endif -%}
{% endfor -%}
{% endif -%}
{% endfor -%}
{% if dependency_commits %}
### Dependencies

{% for commit in dependency_commits %}
{%- if commit.scope -%}
- *({{ commit.scope }})* {{ commit.message }}{% if commit.links %} ({% for link in commit.links %}[{{ link.text }}]({{ link.href }}) {% endfor -%}){% endif %}
{% else -%}
- {{ commit.message }}
{% endif -%}
{% endfor -%}
{% endif -%}
"""
